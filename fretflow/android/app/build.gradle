plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fretsky.scaletrainer'
    compileSdk 34

    defaultConfig {
        applicationId "com.fretsky.scaletrainer"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
